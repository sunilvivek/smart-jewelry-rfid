{% extends 'base.html' %}

{% block content %}

<div class="page-header animate-fade-in">
    <h1><i class="bi bi-pencil-square"></i> Edit Customer</h1>
    <p>Update details for {{ customer.full_name }}</p>
</div>

<div class="card card-p-4 form-section-wide animate-fade-in-delay-1">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label><i class="bi bi-person"></i> Full Name *</label>
            <input type="text" class="form-control" name="full_name" value="{{ customer.full_name }}" required maxlength="100">
        </div>
        <div class="form-group">
            <label><i class="bi bi-telephone"></i> Phone Number *</label>
            <input type="tel" class="form-control" name="phone_number" value="{{ customer.phone_number }}" required maxlength="20" pattern="[0-9]{10,}">
        </div>
        <div class="form-group">
            <label><i class="bi bi-envelope"></i> Email</label>
            <input type="email" class="form-control" name="email" value="{{ customer.email or '' }}" maxlength="100">
        </div>
        <div class="form-group">
            <label><i class="bi bi-house"></i> Address</label>
            <input type="text" class="form-control" name="address" value="{{ customer.address or '' }}" maxlength="200">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
            <div class="form-group">
                <label><i class="bi bi-geo-alt"></i> City</label>
                <input type="text" class="form-control" name="city" value="{{ customer.city or '' }}" maxlength="50">
            </div>
            <div class="form-group">
                <label><i class="bi bi-map"></i> State</label>
                <input type="text" class="form-control" name="state" value="{{ customer.state or '' }}" maxlength="50">
            </div>
            <div class="form-group">
                <label><i class="bi bi-pin"></i> PIN Code</label>
                <input type="text" class="form-control" name="pincode" value="{{ customer.pincode or '' }}" maxlength="10">
            </div>
        </div>
        <div class="form-group">
            <label><i class="bi bi-journal-text"></i> Notes</label>
            <textarea class="form-control" name="notes" rows="3" maxlength="500">{{ customer.notes or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-gold">
                <i class="bi bi-check-lg"></i> Update Customer
            </button>
            <a href="/customers/{{ customer.id }}" class="btn-outline-gold">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
