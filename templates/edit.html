{% extends 'base.html' %}

{% block content %}

<div class="page-header animate-fade-in">
    <h1><i class="bi bi-pencil-square"></i> Edit Jewelry</h1>
    <p>Update details for {{ item.ornament_name }}</p>
</div>

<div class="card card-p-4 form-section animate-fade-in-delay-1">
    <form method="POST">
        <div class="form-group">
            <label><i class="bi bi-tag"></i> Ornament Name</label>
            <input type="text" class="form-control" name="ornament_name" value="{{ item.ornament_name }}" required>
        </div>
        <div class="form-group">
            <label><i class="bi bi-circle-fill text-gold"></i> Metal Type</label>
            <select name="metal_type" class="form-control" required>
                <option value="Gold" {% if item.metal_type == "Gold" %}selected{% endif %}>Gold</option>
                <option value="Silver" {% if item.metal_type == "Silver" %}selected{% endif %}>Silver</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="bi bi-speedometer"></i> Weight (grams)</label>
            <input type="number" step="0.01" class="form-control" name="weight" value="{{ item.weight }}" required>
        </div>
        <div class="form-group">
            <label><i class="bi bi-diamond"></i> Purity</label>
            <input type="text" class="form-control" name="purity" value="{{ item.purity }}" required>
        </div>
        <div class="form-group">
            <label><i class="bi bi-currency-rupee"></i> Price</label>
            <input type="number" class="form-control" name="price" value="{{ item.price }}" required>
        </div>
        <div class="form-group">
            <label><i class="bi bi-info-circle"></i> Status</label>
            <select name="status" class="form-control">
                <option {% if item.status == "Available" %}selected{% endif %}>Available</option>
                <option {% if item.status == "Sold" %}selected{% endif %}>Sold</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-gold">
                <i class="bi bi-check-lg"></i> Update Item
            </button>
            <a href="/inventory" class="btn-outline-gold">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
