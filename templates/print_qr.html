<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print QR - {{ item.ornament_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="print-body">

    <div class="print-label animate-scale-in">
        <div class="print-label-brand">
            <i class="bi bi-gem"></i> BALAJI JEWELLERS
        </div>
        <img src="/static/qrcodes/{{ item.rfid_id }}.png" alt="QR Code for {{ item.rfid_id }}">
        <h3>{{ item.ornament_name }}</h3>
        <div class="print-rfid">{{ item.rfid_id }}</div>
        <div class="print-meta">{{ item.purity }} &bull; {{ item.weight }} g</div>
    </div>

    <button class="btn-print" onclick="window.print()">
        <i class="bi bi-printer"></i> Print Tag
    </button>

</body>

</html>
