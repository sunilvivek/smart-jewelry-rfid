<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#111,#2b2b2b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}

.login-card{
    background:white;
    padding:40px;
    width:420px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:34px;
    color:#D4AF37;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.btn-login{
    width:100%;
    background:#D4AF37;
    border:none;
    color:black;
    font-weight:bold;
    padding:12px;
    border-radius:10px;
}

.btn-login:hover{
    background:#b89018;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
💎 BALAJI JEWELLERS
</div>

<p class="subtitle">
RFID Inventory Management System
</p>

<form method="POST">

<div class="mb-3">
<label>Username</label>
<input
type="text"
name="username"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
name="password"
class="form-control"
required>
</div>

<button class="btn-login">
Login
</button>

</form>

</div>

</body>

</html>
