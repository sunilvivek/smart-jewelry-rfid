<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }} - Balaji Jewellers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-body">

    <div class="login-card" style="text-align:center;">
        <div class="login-logo">
            <i class="bi bi-gem"></i> BALAJI JEWELLERS
        </div>
        <div style="margin:32px 0;">
            <div style="font-size:72px;font-weight:700;color:var(--gray-300);">{{ code }}</div>
            <h2 style="margin:16px 0 8px;color:var(--black);">{{ message }}</h2>
            <p style="color:var(--gray-500);">
                {% if code == 404 %}
                The page you're looking for doesn't exist or has been moved.
                {% else %}
                Something went wrong on our end. Please try again.
                {% endif %}
            </p>
        </div>
        <a href="/" class="btn-login" style="display:inline-flex;text-decoration:none;">
            <i class="bi bi-house"></i> Back to Dashboard
        </a>
    </div>

</body>

</html>
