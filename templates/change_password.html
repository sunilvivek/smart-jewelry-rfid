{% extends 'base.html' %}

{% block content %}

<div class="page-header animate-fade-in">
    <h1><i class="bi bi-key"></i> Change Password</h1>
    <p>Update your admin account password</p>
</div>

<div class="card card-p-4 form-section animate-fade-in-delay-1">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label><i class="bi bi-lock"></i> Current Password</label>
            <input type="password" class="form-control" name="current_password" placeholder="Enter current password" required>
        </div>
        <div class="form-group">
            <label><i class="bi bi-lock-fill"></i> New Password</label>
            <input type="password" class="form-control" name="new_password" placeholder="Enter new password (min 6 characters)" required minlength="6">
        </div>
        <div class="form-group">
            <label><i class="bi bi-lock-fill"></i> Confirm New Password</label>
            <input type="password" class="form-control" name="confirm_password" placeholder="Confirm new password" required minlength="6">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-gold">
                <i class="bi bi-check-lg"></i> Update Password
            </button>
            <a href="/" class="btn-outline-gold">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
