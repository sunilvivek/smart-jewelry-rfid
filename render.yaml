services:
  - type: web
    name: smart-jewelry-rfid
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jewelry-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: jewelry-db
    plan: free
    databaseName: jewelry
